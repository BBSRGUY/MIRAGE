[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mirage-video"
version = "0.1.0"
description = "A single-GPU research harness for compressed-native video generation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "numpy>=1.26", "Pillow>=10", "safetensors>=0.4", "av>=14"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
m2 = [
    "accelerate>=1.0",
    "av>=14",
    "einops>=0.8",
    "openimageio>=3",
    "sentencepiece>=0.2",
    "transformers>=5.8,<5.15",
]

[project.scripts]
mirage = "mirage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest_tmp"

[tool.ruff]
line-length = 100
target-version = "py310"
